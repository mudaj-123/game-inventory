<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#17324d">
    <meta name="description" content="实体游戏库存连续扫码工具">
    <link rel="manifest" href="/static/manifest.webmanifest">
    <link rel="stylesheet" href="/static/styles.css">
    <title>游戏库存扫码</title>
  </head>
  <body>
    <main class="app-shell" data-mode="home">
      <header class="status-bar">
        <h1>游戏库存扫码</h1>
        <span id="network-status" class="network" role="status">正在检测网络…</span>
      </header>
      <section id="login-panel">
        <h2>登录</h2>
        <form id="login-form" class="unknown-form">
          <label for="login-username">用户名</label><input id="login-username" autocomplete="username" required>
          <label for="login-password">密码</label><input id="login-password" type="password" autocomplete="current-password" required>
          <button type="submit">登录</button>
          <p id="login-error" class="error-text" role="alert"></p>
        </form>
      </section>

      <div id="session-bar" hidden><strong id="current-user"></strong>
        <button id="logout" class="text-button" type="button">退出登录</button></div>

      <section id="home-panel" hidden aria-labelledby="home-title">
        <h2 id="home-title">请选择操作</h2>
        <div class="mode-buttons">
          <button class="mode-button inbound" data-mode-button="IN" type="button">
            <span aria-hidden="true">📦</span> 连续入库
          </button>
          <button class="mode-button outbound" data-mode-button="OUT" type="button">
            <span aria-hidden="true">💰</span> 连续出库
          </button>
        </div>
        <button id="transactions-button" class="secondary-button" type="button">今日流水</button>
        <button id="undo-button" class="secondary-button" type="button">撤销上一步</button>
      </section>

      <section id="transactions-panel" hidden><h2>今日流水</h2>
        <div id="transaction-list" class="transaction-list"></div>
        <button id="transactions-back" class="secondary-button" type="button">返回</button>
      </section>

      <section id="scan-panel" class="scan-panel" hidden aria-labelledby="mode-title">
        <p class="eyebrow">当前操作</p>
        <h2 id="mode-title">连续入库</h2>
        <div id="ready-state" class="ready-state">扫码枪已就绪</div>
        <label class="scanner-input-label" for="scanner-input">扫码枪输入</label>
        <input id="scanner-input" class="scanner-input" type="text" inputmode="none"
               autocomplete="off" autocapitalize="off" spellcheck="false">
        <p id="result" class="result" aria-live="assertive">请扫描 8～14 位商品条码</p>
        <button id="manual-toggle" class="secondary-button" type="button">手动输入条码</button>
        <form id="manual-form" class="manual-form" hidden>
          <label for="manual-barcode">条码（8～14 位数字）</label>
          <div class="manual-row">
            <input id="manual-barcode" name="barcode" inputmode="numeric" pattern="[0-9]{8,14}"
                   autocomplete="off" required>
            <button type="submit">提交</button>
          </div>
        </form>
        <form id="unknown-form" class="unknown-form" hidden>
          <h3>补录未知条码</h3>
          <label for="unknown-barcode">条码</label>
          <input id="unknown-barcode" name="barcode" readonly>
          <label for="unknown-game-name">游戏名（必填）</label>
          <input id="unknown-game-name" name="game_name" required maxlength="255">
          <label for="unknown-platform">平台（必填）</label>
          <select id="unknown-platform" name="platform" required>
            <option value="">请选择平台</option>
            <option value="PS5">PS5</option>
            <option value="PS4">PS4</option>
            <option value="SWITCH">SWITCH</option>
            <option value="SWITCH2">SWITCH2</option>
          </select>
          <label for="unknown-region">区域（可选）</label>
          <input id="unknown-region" name="region" maxlength="16">
          <label for="unknown-edition">版本（可选）</label>
          <input id="unknown-edition" name="edition" maxlength="100">
          <div class="unknown-actions">
            <button type="submit">确认并入库</button>
            <button id="unknown-cancel" class="secondary-button" type="button">取消</button>
          </div>
        </form>
        <button id="restore-focus" class="secondary-button" type="button">恢复扫码焦点</button>
        <button id="exit-scan" class="text-button" type="button">退出扫码</button>
      </section>

      <aside id="update-notice" class="update-notice" hidden role="status">
        新版本已就绪。<button id="apply-update" type="button">立即更新</button>
      </aside>
    </main>
    <script src="/static/app.js" defer></script>
  </body>
</html>
