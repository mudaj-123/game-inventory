services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: game_inventory_test
      POSTGRES_USER: game_inventory
      POSTGRES_PASSWORD: test-only-password
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U game_inventory -d game_inventory_test"]
      interval: 1s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
