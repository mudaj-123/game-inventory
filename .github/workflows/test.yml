name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.3
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: game_inventory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d game_inventory_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/game_inventory_test
      TEST_POSTGRES_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/game_inventory_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.3"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --all-extras
      - run: uv run alembic upgrade head
      - run: uv run pytest -q -m 'not postgres'
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client-16
      - run: uv run pytest -q -m postgres
      - run: uv run ruff check .
      - run: uv run python -m compileall -q app alembic tests
      - run: node --check app/static/app.js
      - run: node --check app/static/transaction-groups.js
      - run: node --test tests/js/*.test.cjs
      - run: node --check app/static/service-worker.js
      - name: Browser workflow and lost-response retry
        env:
          NODE_PATH: /tmp/inventory-browser/node_modules
        run: |
          npm install --prefix /tmp/inventory-browser --no-save playwright@1.62.1
          /tmp/inventory-browser/node_modules/.bin/playwright install --with-deps chromium
          uv run python -m app.cli create-admin --username browser-admin --password test-password
          uv run uvicorn app.main:app --host 127.0.0.1 --port 18085 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18085/health; then break; fi
            sleep 1
          done
          node tests/browser-smoke.cjs
      - run: docker build --label org.opencontainers.image.revision="$GITHUB_SHA" -t game-inventory:test .
      - run: cp .env.production.example .env.production
      - run: docker compose --env-file .env.production -f docker-compose.prod.yml config
        env:
          POSTGRES_PASSWORD: ci-placeholder
      - run: bash -n scripts/backup-postgres.sh scripts/restore-postgres.sh
      - run: git diff --check
      - name: Validate Docker Hub username
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: test -n "$DOCKERHUB_USERNAME"
      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Tag and push tested image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          IMAGE="$DOCKERHUB_USERNAME/game-inventory"
          docker tag game-inventory:test "$IMAGE:sha-$GITHUB_SHA"
          docker tag game-inventory:test "$IMAGE:main"
          docker push "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:main"
          echo "Published $IMAGE:sha-$GITHUB_SHA and $IMAGE:main for commit $GITHUB_SHA"

  windows-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse all operational scripts with Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\windows\check-syntax.ps1
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.3"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen --all-extras
      - name: Native Windows process lifecycle (disposable SQLite test database)
        shell: powershell
        run: .\scripts\windows\smoke-test.ps1
      - name: Show sanitized application log on failure
        if: failure()
        shell: powershell
        run: Get-Content .\logs\application.log -Tail 60 -ErrorAction SilentlyContinue
